<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Download the official KamHub Android application.">

  <title>Download KamHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(145deg, #334155, #0f172a);
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 16px;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;
      padding: 32px 22px;
      border-radius: 22px;

      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;

      background: #475569;
      border: 1px solid #64748b;
      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;
      font-weight: bold;
      color: #ff9800;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 12px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .kam {
      color: #ffffff;
    }

    .hub {
      color: #ff9800;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.7;
      color: #cbd5e1;
      margin: 0 0 26px;
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 16px;

      border-radius: 12px;
      background: #ff9800;
      color: #0f172a;

      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .download-btn:active {
      background: #fb8c00;
    }

    .info {
      margin-top: 18px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .privacy {
      display: inline-block;
      margin-top: 24px;
      font-size: 13px;
      color: #e2e8f0;
      text-decoration: underline;
    }

    @media (max-height: 550px) {
      .card {
        padding: 16px;
      }

      .logo {
        width: 52px;
        height: 52px;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 27px;
      }

      .subtitle {
        margin-bottom: 14px;
      }

      .privacy {
        margin-top: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">K</div>

    <h1>
      <span class="kam">Kam</span><span class="hub">Hub</span>
    </h1>

    <p class="subtitle">
      Your everyday management tools,
      all in one Android app.
    </p>

    <a
      class="download-btn"
      href="https://github.com/kamhub-app/kamhub-privacy/releases/latest/download/KamHub-Signed.apk"
    >
      ⬇ Download KamHub
    </a>

    <p class="info">
      Android APK • Direct Download
    </p>

    <a class="privacy" href="./index.html">
      Privacy Policy
    </a>

  </main>

</body>
</html>
