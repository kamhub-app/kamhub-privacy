<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Download KamHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(145deg, #0f172a, #14532d);
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 16px;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;

      padding: 30px 22px;
      border-radius: 22px;

      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 12px 35px rgba(0,0,0,0.2);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;

      background: #22c55e;
      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 36px;
      font-weight: bold;
      color: #052e16;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.6;
      color: #d1fae5;
      margin: 0 0 25px;
    }

    .download-btn {
      display: block;
      width: 100%;

      padding: 16px;
      border-radius: 12px;

      background: #22c55e;
      color: #052e16;

      text-decoration: none;
      font-size: 17px;
      font-weight: bold;

      transition: background 0.2s;
    }

    .download-btn:active {
      background: #16a34a;
    }

    .info {
      margin-top: 18px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .privacy {
      display: inline-block;
      margin-top: 25px;

      font-size: 13px;
      color: #bbf7d0;
      text-decoration: underline;
    }

    @media (max-height: 550px) {
      .card {
        padding: 16px;
      }

      .logo {
        width: 52px;
        height: 52px;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 25px;
      }

      .subtitle {
        margin-bottom: 14px;
      }

      .privacy {
        margin-top: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">K</div>

    <h1>KamHub</h1>

    <p class="subtitle">
      Your everyday management tools,
      all in one Android app.
    </p>

    <a
      class="download-btn"
      href="#"
      id="downloadButton"
    >
      ⬇ Download KamHub
    </a>

    <p class="info">
      Android APK • Direct Download
    </p>

    <a class="privacy" href="./index.html">
      Privacy Policy
    </a>

  </main>

  <script>
    const apkUrl = "";

    document.getElementById("downloadButton")
      .addEventListener("click", function(event) {

        if (!apkUrl) {
          event.preventDefault();
          alert("Download link is being prepared.");
          return;
        }

        this.href = apkUrl;
      });
  </script>

</body>
</html>
